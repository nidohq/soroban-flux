[package]
name = "probe-sdk26"
description = "M0 feasibility probe: exercises flux verification alongside soroban-sdk 26. Kept green in CI as a regression sentinel; never published."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
soroban-flux = { workspace = true }
# The probe holds this workspace to the sdk-26 line (the lib crate itself
# accepts 26–27 for consumers); 26.0.x's testutils chain no longer builds
# (ed25519-dalek CryptoRng drift), so track the 26.1 patch line.
soroban-sdk = "26.1"

[package.metadata.flux]
enabled = true

[lints]
workspace = true
